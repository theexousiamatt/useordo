name: Verify and publish Figma Jerin workspace homepage

on:
  push:
    branches:
      - codex/jerin-mobile-home-20261123
    paths:
      - '.github/workflows/jerin-mobile-home-release.yml'
      - 'src/components/jenri/JerinHomeMobile.tsx'
      - 'src/styles/jenri-home.css'
      - 'src/pages/Dashboard.tsx'
      - 'src/components/AppLayout.tsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ordo-legacy-production-static-release
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out production-derived Jerin source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript checks
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.app.json --noEmit
      - name: Unit and regression tests
        run: npm run test
      - name: Lint mobile and integration components
        run: npx eslint src/components/jenri/JerinHomeMobile.tsx src/pages/Dashboard.tsx src/components/AppLayout.tsx
      - name: Build checked production app
        env:
          VITE_APP_URL: https://ordo.inspirarestudio.com
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -s dist/jenri/jenri-logo.svg
          for asset in ivy-cover.svg velmont-cover.svg tiana-cover.svg devine-cover.svg menu.svg notifications.svg more.svg home.svg projects.svg tasks.svg inbox.svg; do
            test -s "dist/jenri/projects/$asset"
          done
          test -f dist/.htaccess || cp public/.htaccess dist/.htaccess
          printf '{"source_sha":"%s","environment":"production","feature":"jerin-mobile-dashboard-150-4408"}\n' "$GITHUB_SHA" > dist/release.json
          test ! -e dist/.env
          test ! -e dist/.env.production
          if find dist -name '*.map' | grep -q .; then echo 'Unexpected sourcemaps in build'; exit 1; fi
      - name: Verify design route is connected
        run: |
          grep -q 'JerinHomeMobile' src/pages/Dashboard.tsx
          grep -q 'pathname === "/"' src/components/AppLayout.tsx
          grep -q 'jhm-stat-grid' src/styles/jenri-home.css
          grep -q 'jhm-carousel' src/styles/jenri-home.css
      - name: Checkout existing Hostinger artifact branch
        uses: actions/checkout@v4
        with:
          ref: codex/hostinger-static
          path: production-static
          persist-credentials: true
      - name: Guard live release and publish only verified static artifacts
        run: |
          set -euo pipefail
          expected="4866c5b3b75ff3f69ad5446db3a1655f819a6142"
          current="$(git -C production-static rev-parse HEAD)"
          if [ "$current" != "$expected" ]; then
            echo "Production changed since the verified Jerin creation flow. Aborting to preserve existing site."
            exit 1
          fi
          find production-static -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. production-static/
          test -s production-static/index.html
          test ! -e production-static/.env
          git -C production-static config user.name "Jerin release automation"
          git -C production-static config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C production-static add -A
          git -C production-static commit -m "Publish pixel-accurate Jerin mobile workspace home from $GITHUB_SHA"
          git -C production-static push origin HEAD:codex/hostinger-static
