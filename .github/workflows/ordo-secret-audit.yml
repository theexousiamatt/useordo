name: Ordo full-history secret audit

on:
  push:
    branches:
      - codex/legacy-ordo-improvements
    paths:
      - '.github/workflows/ordo-secret-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest
      - name: Scan complete reachable history and report metadata only
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --log-opts="--all" --exit-code 0 --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-redacted.json" .
          python3 - "$RUNNER_TEMP/gitleaks-redacted.json" <<'PY'
          import json, sys, pathlib
          report = pathlib.Path(sys.argv[1])
          items = json.loads(report.read_text()) if report.exists() else []
          print(f"Potential historical findings: {len(items)}")
          for item in items:
              rule = item.get("RuleID", "unknown")
              filename = item.get("File", "unknown")
              line = item.get("StartLine", "?")
              commit = str(item.get("Commit", ""))[:12]
              print(f"Rule: {rule}; file: {filename}; line: {line}; commit: {commit}")
          if items: sys.exit(1)
          PY
