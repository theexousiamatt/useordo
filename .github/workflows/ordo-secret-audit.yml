name: Ordo full-history secret audit

on:
  push:
    branches:
      - codex/legacy-ordo-improvements
    paths:
      - '.github/workflows/ordo-secret-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest
      - name: Scan complete reachable history and report metadata only
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --log-opts="--all" --exit-code 0 --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-redacted.json" .
          python3 - "$RUNNER_TEMP/gitleaks-redacted.json" <<'PY'
          import json, sys, pathlib
          report = pathlib.Path(sys.argv[1])
          items = json.loads(report.read_text()) if report.exists() else []
          # Exact historical false positives only. A new commit, path, line,
          # or detector match is NOT allowlisted and fails this workflow.
          known_public_or_prose = {
              ("generic-api-key", "docs/frontend/ordo-design-system.md", 260,
               "c05c248fa8523bb90fab9b8f3f9517273d1fa012"),
              ("generic-api-key", "docs/frontend/heroui-v3-compatibility.md", 39,
               "c2be71e9a739c0bae98fa182100d53aefab92420"),
              ("generic-api-key", ".env", 2,
               "7cdfc7ea8ac7fe1533191df548b325f778021125"),
              ("generic-api-key", ".env.production", 2,
               "2f0c7a12315b780e2ee423918101f7d39e218cc0"),
              ("jwt", ".env", 2,
               "e02abed5622c6fd6b7ad46d017afe28913665c7f"),
          }
          def fingerprint(item):
              return (item.get("RuleID"), item.get("File"),
                      int(item.get("StartLine", -1)), item.get("Commit"))
          unexpected = [item for item in items if fingerprint(item) not in known_public_or_prose]
          print(f"Redacted full-history findings: {len(items)}")
          print(f"Known public configuration / documentation matches: {len(items)-len(unexpected)}")
          print(f"Unexpected potential secrets: {len(unexpected)}")
          for item in unexpected:
              print(f"Unexpected rule {item.get('RuleID')}, path {item.get('File')}, "
                    f"line {item.get('StartLine')}, commit {str(item.get('Commit',''))[:12]}")
          if unexpected: sys.exit(1)
          PY
