name: Ordo full-history secret audit

on:
  push:
    branches:
      - codex/legacy-ordo-improvements
    paths:
      - '.github/workflows/ordo-secret-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@latest
      - name: Scan complete reachable Git history (redacted output)
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --log-opts="--all" --exit-code 1 --no-banner .
