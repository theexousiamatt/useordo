name: Release Ordo atomic task copy and delete feedback

on:
  push:
    branches:
      - codex/atomic-task-duplicate-delete-feedback-20261114
    paths:
      - '.github/workflows/ordo-atomic-task-copy-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ordo-legacy-production-static-release
  cancel-in-progress: false

jobs:
  ship-verified-atomic-task-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout updated legacy Ordo source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check application TypeScript
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.app.json --noEmit
      - name: Run regression tests
        run: npm run test
      - name: Lint changed task and board components
        run: |
          npx eslint src/hooks/useProjectData.tsx src/components/projects/ProjectBoard.tsx
      - name: Build production static files
        env:
          VITE_APP_URL: https://ordo.inspirarestudio.com
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -f dist/.htaccess || cp public/.htaccess dist/.htaccess
          printf '{"source_sha":"%s","environment":"production","feature":"atomic-task-duplication-and-delete-feedback"}\n' "$GITHUB_SHA" > dist/release.json
          node -e 'JSON.parse(require("fs").readFileSync("dist/release.json","utf8"))'
          test ! -e dist/.env
          test ! -e dist/.env.production
          if find dist -name '*.map' | grep -q .; then
            echo "Refusing to publish source maps"
            exit 1
          fi
      - name: Checkout current static site branch
        uses: actions/checkout@v4
        with:
          ref: codex/hostinger-static
          path: production-static
          persist-credentials: true
      - name: Publish only if rollback anchor remains unchanged
        run: |
          set -euo pipefail
          expected="dd316ee187b7107e19a03fe18f8756035a637eaa"
          actual="$(git -C production-static rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "Production site has changed; refusing overwrite"
            exit 1
          fi
          git fetch origin codex/hostinger-static-pre-atomic-task-copy-20261114
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          find production-static -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. production-static/
          test -s production-static/index.html
          test ! -e production-static/.env
          git -C production-static config user.name "Ordo release automation"
          git -C production-static config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C production-static add -A
          git -C production-static commit -m "Deploy atomic task duplication from ${GITHUB_SHA}"
          git -C production-static push origin HEAD:codex/hostinger-static
