name: Verify Ordo task drawer hierarchy

on:
  push:
    branches:
      - codex/refine-task-drawer-hierarchy-20261114
    paths:
      - '.github/workflows/ordo-task-drawer-verify.yml'
      - 'src/components/projects/TaskDetailDrawer.tsx'
      - 'src/components/projects/TaskDetailDrawer.test.tsx'
      - 'src/components/projects/TaskDrawerProperties.tsx'
      - 'src/components/projects/TaskSubtaskChecklist.tsx'
      - 'src/components/projects/TaskAttachmentsSection.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript checks
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.app.json --noEmit
      - name: Full regression tests
        run: npm run test
      - name: Lint changed drawer components
        run: npx eslint src/components/projects/TaskDetailDrawer.tsx src/components/projects/TaskDetailDrawer.test.tsx src/components/projects/TaskDrawerProperties.tsx src/components/projects/TaskSubtaskChecklist.tsx src/components/projects/TaskAttachmentsSection.tsx
      - name: Production build
        run: npm run build
