name: QA Ordo project task lifecycle (disposable)

on:
  push:
    branches:
      - codex/qa-project-lifecycle-20261114
    paths:
      - '.github/workflows/ordo-project-lifecycle-qa.yml'
      - 'supabase/tests/project-lifecycle-qa.sql'
      - 'supabase/tests/project-lifecycle-after-refresh.sql'
      - 'src/**'
      - 'scripts/qa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.app.json --noEmit
      - name: All application regression tests
        run: npm run test
      - name: Production build
        run: npm run build
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated Supabase database
        run: supabase start
      - name: Install PostgreSQL client if missing
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Full SQL task, stage, checklist and label lifecycle
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/tests/project-lifecycle-qa.sql
      - name: Confirm all changes persist in a new DB connection, with outsider isolation
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/tests/project-lifecycle-after-refresh.sql
      - name: Export disposable local Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/ordo-qa-supabase.env
          source /tmp/ordo-qa-supabase.env
          : "${ANON_KEY:?Missing local anon key}"
          : "${SERVICE_ROLE_KEY:?Missing local service role key}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          echo "QA_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "QA_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "QA_SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
      - name: Seed isolated browser account and project
        run: node scripts/qa/seed-browser.mjs
      - name: Start QA application (local API, never production)
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ordo-qa-vite.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ordo-qa-vite.log
          exit 1
      - name: Install Playwright browser for desktop and mobile checks
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test authenticated desktop and mobile task interactions
        run: node scripts/qa/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordo-desktop-mobile-qa
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy temporary database
        if: always()
        run: supabase stop --no-backup || true
