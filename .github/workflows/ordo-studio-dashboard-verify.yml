name: Verify Ordo studio dashboard

on:
  push:
    branches:
      - codex/studio-dashboard-overview-20261114
    paths:
      - '.github/workflows/ordo-studio-dashboard-verify.yml'
      - 'src/hooks/useStudioDashboard.ts'
      - 'src/lib/studioDashboard.ts'
      - 'src/lib/studioDashboard.test.ts'
      - 'src/pages/Dashboard.tsx'
      - 'src/pages/ProjectDetail.tsx'
  pull_request:
    paths:
      - '.github/workflows/ordo-studio-dashboard-verify.yml'
      - 'src/hooks/useStudioDashboard.ts'
      - 'src/lib/studioDashboard.ts'
      - 'src/lib/studioDashboard.test.ts'
      - 'src/pages/Dashboard.tsx'
      - 'src/pages/ProjectDetail.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.app.json --noEmit
      - name: Run regression tests
        run: npm run test
      - name: Lint dashboard changes
        run: npx eslint src/hooks/useStudioDashboard.ts src/lib/studioDashboard.ts src/lib/studioDashboard.test.ts src/pages/Dashboard.tsx src/pages/ProjectDetail.tsx
      - name: Build production assets
        run: npm run build
