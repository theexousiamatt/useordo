name: Release Ordo legacy static site to production

on:
  push:
    branches:
      - codex/owned-supabase-backend
    paths:
      - '.github/workflows/ordo-production-release.yml'
      - 'src/components/projects/ProjectBoard.tsx'
      - 'src/hooks/useProjectStages.ts'
      - 'src/components/ordo/OrdoColumnContextMenu.tsx'
      - 'src/lib/legacyStageBoard.ts'
      - 'src/lib/legacyStageBoard.test.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ordo-legacy-production-static-release
  cancel-in-progress: false

jobs:
  ship-verified-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tested legacy source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Execute regression tests
        run: npm run test
      - name: Lint legacy changes
        run: npx eslint src/components/projects/ProjectBoard.tsx src/components/projects/ProjectTeamDrawer.tsx src/components/ordo/OrdoColumnContextMenu.tsx src/components/ordo/OrdoCardContextMenu.tsx src/components/ordo/OrdoBulkActionMenu.tsx src/hooks/useProjectStages.ts src/hooks/useProjectData.tsx src/hooks/useProjects.tsx src/lib/legacyStageBoard.ts src/lib/legacyStageBoard.test.ts src/pages/ProjectDetail.tsx
      - name: Build production static assets
        env:
          VITE_APP_URL: https://ordo.inspirarestudio.com
        run: |
          npm run build
          test -s dist/index.html
          test -f dist/.htaccess || cp public/.htaccess dist/.htaccess
          printf '{"source_sha":"%s","environment":"production"}\n' "$GITHUB_SHA" > dist/release.json
          test ! -e dist/.env
          test ! -e dist/.env.production
          if find dist -name '*.map' | grep -q .; then
            echo 'Refusing to publish source maps'; exit 1
          fi
      - name: Checkout currently deployed static branch
        uses: actions/checkout@v4
        with:
          ref: codex/hostinger-static
          path: production-static
          persist-credentials: true
      - name: Guard rollback anchor and publish static release
        run: |
          set -euo pipefail
          current_static_sha="$(git -C production-static rev-parse HEAD)"
          expected_static_sha="94b9a443a8f6bf8858889b54f3c588b6923e9e9f"
          if [ "$current_static_sha" != "$expected_static_sha" ]; then
            echo "Production static branch has changed; refusing automated overwrite"
            exit 1
          fi
          git fetch origin codex/hostinger-static-rollback-20261112
          rollback_sha="$(git rev-parse FETCH_HEAD)"
          test "$rollback_sha" = "0f48d88cadad592dcfc087bcfd855b0129e3d0e4"
          find production-static -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. production-static/
          test -s production-static/index.html
          test ! -e production-static/.env
          git -C production-static config user.name "Ordo release automation"
          git -C production-static config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C production-static add -A
          git -C production-static commit -m "Deploy verified legacy Ordo source ${GITHUB_SHA}"
          git -C production-static push origin HEAD:codex/hostinger-static
