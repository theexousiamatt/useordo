name: Ordo duplicate project Edge Function verification

on:
  push:
    branches:
      - codex/legacy-ordo-improvements
    paths:
      - '.github/workflows/ordo-edge-verify.yml'
      - 'supabase/functions/duplicate-project/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck the deployed Edge Function source
        run: deno check supabase/functions/duplicate-project/index.ts
      - name: Static release assertions
        run: |
          grep -q 'const stageIdMap = new Map' supabase/functions/duplicate-project/index.ts
          grep -q 'stage_id: t.stage_id' supabase/functions/duplicate-project/index.ts
          grep -q 'getUser(token)' supabase/functions/duplicate-project/index.ts
