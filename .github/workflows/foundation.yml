name: Ordo foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:foundation
      - run: npm test
      - run: npm run test:foundation:safety
      - run: npm run verify:foundation:local
      - run: npm run build
      - run: npm run build:foundation
        env:
          VITE_ORDO_ARCHITECTURE: foundation
          VITE_ORDO_ENVIRONMENT: development
          VITE_APP_URL: http://127.0.0.1:5182
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          # A syntactically valid build-only key. CI makes no backend requests.
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-only-public-placeholder
