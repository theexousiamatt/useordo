name: Prepare task mentions migration

on:
  push:
    branches:
      - codex/core-experience-upgrade-20261114
    paths:
      - '.github/workflows/ordo-create-mentions-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Generate migration using Supabase CLI
        run: |
          set -euo pipefail
          supabase migration new task_mention_notifications
          test "$(find supabase/migrations -maxdepth 1 -name '*task_mention_notifications.sql' | wc -l)" -eq 1
      - name: Commit migration shell for security review
        run: |
          git config user.name "Ordo release automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*task_mention_notifications.sql
          git commit -m "chore: scaffold task mentions migration through Supabase CLI"
          git push origin HEAD:codex/core-experience-upgrade-20261114
